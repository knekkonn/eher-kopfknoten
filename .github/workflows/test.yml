name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/abgrund-browser playwright@1.64.1 --no-audit --no-fund
      - run: /tmp/abgrund-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/abgrund-http.log 2>&1 &
      - run: node tests/browser/layout.cjs && node tests/browser/perks.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/abgrund-browser/node_modules/playwright
